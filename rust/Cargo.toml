[package]
name = "troll_farm_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "=1.10.0"
rayon-core = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lib]
name = "troll_farm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bot"
path = "src/main.rs"

[[bin]]
name = "tournament"
path = "src/bin/tournament.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "curve"
path = "src/bin/curve.rs"

[[bin]]
name = "search_time"
path = "src/bin/search_time.rs"

[[bin]]
name = "mapstat"
path = "src/bin/mapstat.rs"

# The following two targets are module-only source files for closed research
# experiments (D35c, D36 — see docs/LEDGER-MAP.md Arc C). They are included
# via #[path] from working shim bins (e.g. d35b_factorized_joint_bundle_oracle,
# d35c_provenance_competitive_bundle_oracle, d36_resident_anchored_constrained_joint_oracle)
# and were never meant to be compiled as standalone crate roots. Cargo's
# src/bin auto-discovery nonetheless treats every *.rs file here as its own
# bin, so without this explicit entry + required-features gate they fail
# `cargo build --workspace` with pre-existing compile errors (frozen, must
# not be edited — the source documents what actually ran in the experiment).
[[bin]]
name = "d35c_provenance_competitive_bundle_oracle_impl"
path = "src/bin/d35c_provenance_competitive_bundle_oracle_impl.rs"
required-features = ["research-d35c"]

[[bin]]
name = "d36_resident_anchored_constrained_joint_oracle_impl"
path = "src/bin/d36_resident_anchored_constrained_joint_oracle_impl.rs"
required-features = ["research-d36"]

[features]
research-d35c = []
research-d36 = []
