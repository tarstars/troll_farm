[package]
name = "troll_farm_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "=1.10.0"
rayon-core = "=1.12.1"

[lib]
name = "troll_farm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bot"
path = "src/main.rs"

[[bin]]
name = "tournament"
path = "src/bin/tournament.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "curve"
path = "src/bin/curve.rs"

[[bin]]
name = "search_time"
path = "src/bin/search_time.rs"

[[bin]]
name = "mapstat"
path = "src/bin/mapstat.rs"
