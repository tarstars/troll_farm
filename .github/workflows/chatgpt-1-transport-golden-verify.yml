name: chatgpt_1 transport and M3a verification

on:
  push:
    branches:
      - agent/chatgpt_1-verify-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all authoritative branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Record exact transport identity and run authoritative sweep
        shell: bash
        run: |
          mkdir -p verification-output
          {
            echo "workflow_head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse refs/remotes/origin/main)"
            echo "chatgpt_1=$(git rev-parse refs/remotes/origin/agent/chatgpt_1)"
            echo "inbox_sweep_git_blob=$(git hash-object scripts/inbox_sweep.py)"
            sha256sum scripts/inbox_sweep.py
            sha256sum scripts/lint_outbox.py
          } | tee verification-output/transport-identity.txt

          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_1 --fetch \
            > verification-output/inbox-sweep.stdout.txt \
            2> verification-output/inbox-sweep.stderr.txt
          sweep_rc=$?
          set -e
          echo "$sweep_rc" > verification-output/inbox-sweep.exit-code.txt
          cat verification-output/inbox-sweep.stdout.txt
          cat verification-output/inbox-sweep.stderr.txt >&2
          echo "inbox_sweep_exit_code=$sweep_rc"

      - name: Regenerate and renew the M3a golden bundle
        shell: bash
        run: |
          mkdir -p verification-output
          old_manifest=chatgpt_1/m3a-golden-set-manifest-2026-08-10.json
          new_manifest=chatgpt_1/m3a-golden-set-manifest-v2-2026-08-09.json
          golden=chatgpt_1/m3a-d1-situation-library-2026-08-10.json

          python3 chatgpt_1/m3a_extract_from_panel.py \
            --check \
            --output verification-output/m3a-d1-situation-library-regenerated.json \
            > verification-output/m3a-extractor.stdout.txt \
            2> verification-output/m3a-extractor.stderr.txt

          diff -u "$golden" \
            verification-output/m3a-d1-situation-library-regenerated.json \
            > verification-output/m3a-pre-renewal.diff || true
          cp verification-output/m3a-d1-situation-library-regenerated.json "$golden"

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          repo = Path.cwd()
          old_manifest_path = repo / "chatgpt_1/m3a-golden-set-manifest-2026-08-10.json"
          new_manifest_path = repo / "chatgpt_1/m3a-golden-set-manifest-v2-2026-08-09.json"
          verifier_path = repo / "chatgpt_1/m3a_verify_golden_set.py"
          tests_path = repo / "chatgpt_1/test_m3a_golden_set.py"

          verifier = verifier_path.read_text(encoding="utf-8")
          verifier = verifier.replace(
              'm3a-golden-set-manifest-2026-08-10.json',
              'm3a-golden-set-manifest-v2-2026-08-09.json',
          )
          verifier = verifier.replace(
              'troll-farm-m3a-golden-bundle/v1',
              'troll-farm-m3a-golden-bundle/v2',
          )
          verifier_path.write_text(verifier, encoding="utf-8")

          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'm3a-golden-set-manifest-2026-08-10.json',
              'm3a-golden-set-manifest-v2-2026-08-09.json',
          )
          tests_path.write_text(tests, encoding="utf-8")

          manifest = json.loads(old_manifest_path.read_text(encoding="utf-8"))
          manifest["schema"] = "troll-farm-m3a-golden-bundle/v2"
          manifest["supersedes"] = [
              "chatgpt_1/m3a-golden-set-manifest-2026-08-10.json"
          ]
          manifest["renewal"] = {
              "reason": "The v1 golden JSON predated the extractor's episode_ledger_sha256 field; second-checkout execution reproduced all 34 episodes and exposed the byte drift.",
              "source_review": "local_claude_1/m3a-golden-bundle-verification-2026-08-10.md",
              "renewed_by": "github-actions on agent/chatgpt_1-verify-20260811",
              "policy": "All source, toolchain, test, and output bytes are re-pinned together; external review remains mandatory before adoption."
          }
          manifest["regeneration"]["bundle_verification"] = (
              "python3 chatgpt_1/m3a_verify_golden_set.py --manifest "
              "chatgpt_1/m3a-golden-set-manifest-v2-2026-08-09.json"
          )

          def git_blob_sha1(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for artifact in manifest["artifacts"]:
              path = repo / artifact["path"]
              if not path.is_file():
                  raise SystemExit(f"missing artifact during renewal: {artifact['path']}")
              artifact["git_blob_sha1"] = git_blob_sha1(path)
              artifact["sha256"] = sha256(path)

          new_manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          set +e
          python3 chatgpt_1/m3a_verify_golden_set.py --manifest "$new_manifest" \
            > verification-output/m3a-verifier.stdout.txt \
            2> verification-output/m3a-verifier.stderr.txt
          verifier_rc=$?

          python3 chatgpt_1/test_m3a_golden_set.py \
            > verification-output/m3a-tests.stdout.txt \
            2> verification-output/m3a-tests.stderr.txt
          tests_rc=$?
          set -e

          cmp -s \
            verification-output/m3a-d1-situation-library-regenerated.json \
            "$golden"
          cmp_rc=$?

          {
            echo "extractor_exit_code=0"
            echo "post_renewal_byte_compare_exit_code=$cmp_rc"
            echo "verifier_exit_code=$verifier_rc"
            echo "tests_exit_code=$tests_rc"
            sha256sum verification-output/m3a-d1-situation-library-regenerated.json
            sha256sum "$golden"
            sha256sum "$new_manifest"
            git hash-object "$golden"
            git hash-object "$new_manifest"
          } | tee verification-output/m3a-summary.txt

          cat verification-output/m3a-extractor.stdout.txt
          cat verification-output/m3a-extractor.stderr.txt >&2
          cat verification-output/m3a-verifier.stdout.txt
          cat verification-output/m3a-verifier.stderr.txt >&2
          cat verification-output/m3a-tests.stdout.txt
          cat verification-output/m3a-tests.stderr.txt >&2

          echo "$verifier_rc" > verification-output/m3a-verifier.exit-code.txt
          echo "$tests_rc" > verification-output/m3a-tests.exit-code.txt

      - name: Materialize durable verification records
        shell: bash
        run: |
          mkdir -p chatgpt_1/verification
          cp verification-output/transport-identity.txt chatgpt_1/verification/
          cp verification-output/inbox-sweep.stdout.txt chatgpt_1/verification/
          cp verification-output/inbox-sweep.stderr.txt chatgpt_1/verification/
          cp verification-output/inbox-sweep.exit-code.txt chatgpt_1/verification/
          cp verification-output/m3a-summary.txt chatgpt_1/verification/
          cp verification-output/m3a-verifier.stdout.txt chatgpt_1/verification/
          cp verification-output/m3a-verifier.stderr.txt chatgpt_1/verification/
          cp verification-output/m3a-verifier.exit-code.txt chatgpt_1/verification/
          cp verification-output/m3a-tests.stdout.txt chatgpt_1/verification/
          cp verification-output/m3a-tests.stderr.txt chatgpt_1/verification/
          cp verification-output/m3a-tests.exit-code.txt chatgpt_1/verification/
          cp verification-output/m3a-pre-renewal.diff chatgpt_1/verification/

          cat > chatgpt_1/transport-verification-2026-08-09.md <<'EOF'
          # Transport verification

          This record was generated in GitHub Actions from the exact committed branch checkout.
          The literal SHA-256 values and authoritative inbox-sweep output are committed under
          `chatgpt_1/verification/`. A sweep exit code of 1 means the transport is healthy but an
          acknowledgment obligation remains; exit code 2 means transport failure.

          The Git blob and SHA-256 are deliberately both retained: the former proves repository
          identity, while the latter closes the coordinator's literal digest request.
          EOF

          cat > chatgpt_1/m3a-golden-bundle-renewal-2026-08-09.md <<'EOF'
          # M3a golden-bundle renewal v2

          The v1 bundle correctly identified 34 D-1 episodes in 32 source-game situations, but its
          committed golden JSON predated the extractor's `episode_ledger_sha256` field. The renewal
          regenerates that JSON, updates the verifier and tests to a v2 manifest, and re-pins every
          source, tool, test, and output byte together.

          This is execution evidence, not self-acceptance. The v2 manifest retains the external
          `local_claude_1` execution and `claude_1` cross-implementation review requirements.
          Exact verifier, test, hash, and pre-renewal diff outputs are under
          `chatgpt_1/verification/`.
          EOF

      - name: Commit the measured evidence and renewed bundle
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            chatgpt_1/m3a-d1-situation-library-2026-08-10.json \
            chatgpt_1/m3a_verify_golden_set.py \
            chatgpt_1/test_m3a_golden_set.py \
            chatgpt_1/m3a-golden-set-manifest-v2-2026-08-09.json \
            chatgpt_1/m3a-golden-bundle-renewal-2026-08-09.md \
            chatgpt_1/transport-verification-2026-08-09.md \
            chatgpt_1/verification
          git commit -m "verify transport and renew M3a golden bundle v2 [skip ci]"
          git push origin HEAD:agent/chatgpt_1-verify-20260811

      - name: Upload exact verification packet
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-1-transport-m3a-verification
          path: verification-output/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce renewed bundle success
        shell: bash
        run: |
          test "$(cat verification-output/m3a-verifier.exit-code.txt)" = "0"
          test "$(cat verification-output/m3a-tests.exit-code.txt)" = "0"
