name: banana zero-oscillation PR gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "chatgpt_1/banana-solve/**"
      - "claude_1/banana-restoration-r2/**"
      - "claude_1/pipeline/**"
      - ".github/workflows/chatgpt-banana-zero-oscillation-pr.yml"

permissions:
  contents: read

concurrency:
  group: banana-zero-oscillation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run canonical zero-oscillation gate
        shell: bash
        env:
          ZERO_GATE_OUT: ${{ github.workspace }}/chatgpt_1/banana-solve/ci/zero-oscillation-pr
        run: bash chatgpt_1/banana-solve/run_zero_oscillation_gate.sh

      - name: Upload exact gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banana-zero-oscillation-${{ github.event.pull_request.head.sha }}
          path: |
            chatgpt_1/banana-solve/ci/zero-oscillation-pr
            chatgpt_1/banana-solve/candidate-banana-r2.min.rs
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs
          if-no-files-found: warn
          retention-days: 30
