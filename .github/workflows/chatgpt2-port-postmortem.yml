name: chatgpt2-port-postmortem

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chatgpt_2
    paths:
      - chatgpt_2/port-postmortem/analyse.py
      - chatgpt_2/port-postmortem/calibrate.py
      - .github/workflows/chatgpt2-port-postmortem.yml

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run closed-loop post-mortem read
        run: |
          set -euo pipefail
          mkdir -p chatgpt_2/port-postmortem/results
          python3 chatgpt_2/port-postmortem/analyse.py 2>&1 | tee chatgpt_2/port-postmortem/results/run.log
          python3 chatgpt_2/port-postmortem/calibrate.py 2>&1 | tee chatgpt_2/port-postmortem/results/calibration.log
      - name: Upload result packet
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt2-port-postmortem-results
          path: chatgpt_2/port-postmortem/results/
          if-no-files-found: error
