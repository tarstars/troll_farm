name: chatgpt1-publish-revival-proof

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tool-digest-proof.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical agent branch
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Stage, lint, and publish the first revival message
        shell: bash
        run: |
          set -u
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --prune origin
          test "$(git rev-parse origin/main)" = '5b31279d514d05d4374c3d983a068a6065235a7a'
          test "$(git hash-object scripts/inbox_sweep.py)" = '89b85421e117b0980926570129cd5d82c0768a50'
          test "$(git hash-object scripts/lint_outbox.py)" = '83d35e13681c5c32e2ad92b174c2a9c3de1f1c4f'
          grep -Fx 'f6daba65bcd9a18069c40edf9f2aba74fd83ee1edc64b436b44dab1d4dd14094  scripts/inbox_sweep.py' chatgpt_1/verification/revival-tool-digest-2026-08-22.txt
          grep -Fx '36457491e3f931bb244067184072842fb37bd9f1d03f6d5867fa75cbadc6dd88  scripts/lint_outbox.py' chatgpt_1/verification/revival-tool-digest-2026-08-22.txt
          path='coordination/messages/chatgpt_1/20260822T080000Z-20260822-chatgpt1-revival-ack.md'
          log='chatgpt_1/verification/revival-first-message-lint-2026-08-22.txt'
          test ! -e "$path"
          mkdir -p "$(dirname "$path")" "$(dirname "$log")"
          printf '%s' '' | base64 -d > "$path"
          git add "$path"
          set +e
          python3 scripts/lint_outbox.py --me chatgpt_1 --fetch --staged > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          git config user.name 'chatgpt_1'
          git config user.email 'chatgpt_1@users.noreply.github.com'
          if [ "$rc" -eq 0 ]; then
            git add "$log"
            git rm .github/workflows/chatgpt1-tool-digest-proof.yml
            git commit -m 'ack: publish verified revival tool digest [skip ci]'
          else
            git reset HEAD "$path"
            rm -f "$path"
            {
              printf '\nLINT_EXIT=%s\n' "$rc"
              printf 'MESSAGE_NOT_PUBLISHED=1\n'
            } >> "$log"
            git add "$log"
            git rm .github/workflows/chatgpt1-tool-digest-proof.yml
            git commit -m 'blocker: record failed revival-message lint [skip ci]'
          fi
          git push origin HEAD:agent/chatgpt_1
