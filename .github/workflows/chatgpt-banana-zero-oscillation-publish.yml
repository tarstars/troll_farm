name: publish banana zero-oscillation evidence

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve
    paths:
      - "chatgpt_1/banana-solve/build_candidate*.py"
      - "chatgpt_1/banana-solve/run_stable_gate.py"
      - "chatgpt_1/banana-solve/run_zero_oscillation_gate.sh"
      - "chatgpt_1/banana-solve/gate-contract-v1.*"
      - "chatgpt_1/banana-solve/*TRIGGER*"
      - ".github/workflows/chatgpt-banana-zero-oscillation-publish.yml"

permissions:
  contents: write

concurrency:
  group: publish-banana-zero-oscillation
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip zero-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/chatgpt_1-banana-solve

      - name: Run canonical gate
        shell: bash
        env:
          ZERO_GATE_OUT: ${{ github.workspace }}/chatgpt_1/banana-solve/ci/zero-oscillation-published
        run: bash chatgpt_1/banana-solve/run_zero_oscillation_gate.sh

      - name: Commit deterministic candidate and exact evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            chatgpt_1/banana-solve/candidate-banana-r2.min.rs \
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json \
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs \
            chatgpt_1/banana-solve/ci/zero-oscillation-published
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
            exit 0
          fi
          git commit -m "ci: publish zero-oscillation candidate and evidence [skip zero-gate]"
          git pull --rebase origin agent/chatgpt_1-banana-solve
          git push origin HEAD:agent/chatgpt_1-banana-solve

      - name: Upload published evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banana-zero-oscillation-published-${{ github.sha }}
          path: |
            chatgpt_1/banana-solve/ci/zero-oscillation-published
            chatgpt_1/banana-solve/candidate-banana-r2.min.rs
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs
          if-no-files-found: warn
          retention-days: 30
