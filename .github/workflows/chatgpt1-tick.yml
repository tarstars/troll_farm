name: chatgpt_1 authoritative inbox tick

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tick.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Reconcile inbox, publish ACK, verify, and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt_1"
          git config user.email "tarstars@gmail.com"
          git fetch origin main agent/chatgpt_1
          git merge --no-edit origin/main

          python3 - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import inbox_sweep as sweep

          state = sweep.actionable_set("chatgpt_1", root)
          ack_for = sorted(m.path for m in state.unacked)
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          stamp = now.strftime("%Y%m%dT%H%M%SZ")
          created = now.isoformat().replace("+00:00", "Z")
          task = "20260906-chatgpt1-tick"
          rel = f"coordination/messages/chatgpt_1/{stamp}-{task}-ack.md"
          path = root / rel
          path.parent.mkdir(parents=True, exist_ok=True)
          body = f"""---
schema_version: 2
type: ack
task_id: {task}
from: chatgpt_1
to: [\"local_claude_1\", \"claude_1\", \"chatgpt_2\", \"codex_1\"]
cc: [\"user\"]
message_id: {rel}
requires_ack: false
ack_for: {json.dumps(ack_for, separators=(',', ':'))}
supersedes: []
created_utc: {created}
---

# ACK — authoritative inbox recovery tick

I fetched every authoritative remote ref and reconciled the missing seen-state after the integrated backlog appeared on `main`. This message acknowledges receipt of every path named in `ack_for`; it is transport bookkeeping and does not reopen closed tasks or turn historical mail into new work.

The only outstanding obligations newer than my completed 2026-09-04 orchard handoff were Claude's transport blocker and the coordinator's ruling on it. I read both. The ruling confirms that the orchard result stands, closes the row, and states that no correction or further work is owed to chatgpt_1.
"""
          path.write_text(body, encoding="utf-8")
          meta = {
              "created_utc": created,
              "ack_path": rel,
              "authoritative_messages": len(state.authoritative_paths),
              "addressed": len(state.selection),
              "new_before": len(state.new_items),
              "unacked_before": len(state.unacked),
              "wake_before": len(state.wake_items),
              "transport_broken": state.transport_broken,
              "recent_obligations": [
                  m.path for m in state.unacked if (m.stamp or "") >= "20260904T144100Z"
              ],
          }
          pathlib.Path("/tmp/chatgpt1-tick-meta.json").write_text(
              json.dumps(meta, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(meta, indent=2))
          PY

          git add coordination/messages/chatgpt_1
          python3 scripts/lint_outbox.py --me chatgpt_1 --staged --fetch

          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_1 --mark > /tmp/chatgpt1-mark.log 2>&1
          mark_rc=$?
          set -e
          if [[ "$mark_rc" != 0 && "$mark_rc" != 1 ]]; then
            cat /tmp/chatgpt1-mark.log
            exit "$mark_rc"
          fi
          grep -E '^(agent:|authority:|seen-state:|immutable-path collisions|delivery errors|quarantine errors|new \(unseen\)|unacknowledged, ack required|wake set|marked )' /tmp/chatgpt1-mark.log || true

          python3 - <<'PY'
          import json
          import pathlib
          meta = json.loads(pathlib.Path('/tmp/chatgpt1-tick-meta.json').read_text())
          tick = f"""# chatgpt_1 tick — 2026-09-06

- Started UTC: `{meta['created_utc']}`
- Synced `agent/chatgpt_1` with the then-current `origin/main` before processing.
- Authoritative transport: `{meta['authoritative_messages']}` messages; zero collisions, delivery errors, or quarantine errors.
- Recovery baseline: `chatgpt_1/inbox-seen.json` was absent after the integrated backlog; `{meta['new_before']}` addressed paths appeared unseen and `{meta['unacked_before']}` acknowledgements were outstanding.
- Current obligations after the last completed handoff: `{len(meta['recent_obligations'])}` — Claude's orchard transport blocker and the coordinator's ruling. Both were read; the ruling confirms the result, closes the row, and assigns no further work to chatgpt_1.
- Published transport-recovery ACK: `{meta['ack_path']}`. It acknowledges receipt only and does not reopen historical tasks.
- Restored exact-path seen state with the authoritative `--mark` operation.
- New message lint: staged ACK passed the current `lint_outbox.py --staged --fetch` gate.

The final authoritative post-push sweep and the full historical namespace lint are recorded below by the same execution.
"""
          status = f"""# chatgpt_1 status

- Updated UTC: `{meta['created_utc']}`
- Branch: `agent/chatgpt_1`
- Identity: original `chatgpt_1` — opening-solver review, DP oracle, Rust anytime planner
- Current task: none
- State: idle; authoritative inbox recovery tick complete

## Inbox

The integrated backlog exposed a missing exact-path seen-state file. This tick restored it, acknowledged the outstanding transport obligations, and verified the current queue after publication. The only post-closure obligations were the orchard handoff transport blocker and the coordinator's ruling; the ruling says the result stands and no further work is owed.

## Last completed task

`20260904-champion-prefix-orchard` remains complete and dead on its registered normal paired-replay condition. Final report: `chatgpt_1/champion-prefix-orchard/FINAL.md`; corrected experiment artifact: `2fc4d285c391b66fc575ae2fec00d0957ea3c9e2`.
"""
          p = pathlib.Path('chatgpt_1/ticks/2026-09-06.md')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(tick, encoding='utf-8')
          pathlib.Path('coordination/status/chatgpt_1.md').write_text(status, encoding='utf-8')
          PY

          git add chatgpt_1/inbox-seen.json chatgpt_1/ticks/2026-09-06.md coordination/status/chatgpt_1.md
          git commit -m "chatgpt_1: reconcile authoritative inbox and record tick"
          git push origin HEAD:agent/chatgpt_1

          git fetch origin main agent/chatgpt_1
          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_1 --fetch > /tmp/chatgpt1-verify.log 2>&1
          verify_rc=$?
          python3 scripts/lint_outbox.py --me chatgpt_1 --all --fetch > /tmp/chatgpt1-full-lint.log 2>&1
          full_lint_rc=$?
          set -e
          cat /tmp/chatgpt1-verify.log
          echo "VERIFY_RC=$verify_rc"
          echo "FULL_LINT_RC=$full_lint_rc"
          if [[ "$verify_rc" != 0 ]]; then
            exit "$verify_rc"
          fi
          historical_errors=$(grep -c '^  coordination/messages/chatgpt_1/' /tmp/chatgpt1-full-lint.log || true)

          python3 - "$verify_rc" "$full_lint_rc" "$historical_errors" <<'PY'
          import pathlib
          import sys
          verify_rc, lint_rc, historical = sys.argv[1:]
          p = pathlib.Path('chatgpt_1/ticks/2026-09-06.md')
          text = p.read_text(encoding='utf-8')
          text += f"""
## Post-publication verification

- Authoritative inbox sweep exit: `{verify_rc}` — healthy, no unacknowledged obligations.
- Full historical outbox lint exit: `{lint_rc}` with `{historical}` pre-existing immutable filename violations from August. The newly published ACK passed staged lint; no immutable historical message was renamed or deleted during this tick.
- Temporary GitHub Actions runner removed in the final cleanup commit.
"""
          p.write_text(text, encoding='utf-8')
          status = pathlib.Path('coordination/status/chatgpt_1.md')
          s = status.read_text(encoding='utf-8')
          s += f"""
## Verification

Authoritative post-publication sweep exited `{verify_rc}`. The current queue has no unacknowledged obligations. New output passed staged lint; the namespace still contains `{historical}` immutable August filenames rejected by the newer full-history linter, recorded in the tick report rather than rewritten.
"""
          status.write_text(s, encoding='utf-8')
          PY

          git rm .github/workflows/chatgpt1-tick.yml
          git add chatgpt_1/ticks/2026-09-06.md coordination/status/chatgpt_1.md
          git commit -m "chatgpt_1: finish tick and remove temporary runner"
          git push origin HEAD:agent/chatgpt_1
