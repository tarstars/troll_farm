name: chatgpt_1 authoritative inbox tick

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Isolate current obligations and validate outbox
        shell: bash
        run: |
          set +e
          git fetch origin main agent/chatgpt_1
          echo '=== PRIOR SEEN-STATE HISTORY ==='
          git log --all --format='%H %cI %s' -- chatgpt_1/inbox-seen.json | head -n 10
          echo '=== CURRENT OUTSTANDING ACKS AFTER LAST COMPLETED HANDOFF ==='
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import inbox_sweep as s
          root = pathlib.Path.cwd()
          state = s.actionable_set('chatgpt_1', root)
          cutoff = '20260904T144100Z'
          rows = []
          for m in state.unacked:
              stamp = m.stamp or ''
              if stamp >= cutoff:
                  rows.append((m.path, m.kind, m.task, m.sender))
          print(f'unacked_total={len(state.unacked)}')
          print(f'unacked_since_cutoff={len(rows)}')
          for row in rows:
              print(' | '.join(row))
          print(f'new_total={len(state.new_items)}')
          recent_new = [m for m in state.new_items if (m.stamp or '') >= cutoff]
          print(f'new_since_cutoff={len(recent_new)}')
          for m in recent_new[-100:]:
              print('NEW | ' + ' | '.join((m.path, m.kind, m.task, m.sender)))
          PY
          obligations_rc=$?
          echo "OBLIGATIONS_RC=$obligations_rc"
          echo '=== OUTBOX LINT ==='
          python3 scripts/lint_outbox.py --me chatgpt_1 --fetch
          lint_rc=$?
          echo "LINT_RC=$lint_rc"
          exit 0
