name: chatgpt_1 authoritative inbox tick

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Run authoritative revive, mark, and outbox lint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/chatgpt_1
          echo '=== refs ==='
          git rev-parse HEAD
          git rev-parse origin/main
          echo '=== worktree digests ==='
          sha256sum scripts/inbox_sweep.py scripts/lint_outbox.py
          echo '=== origin/main digests ==='
          git show origin/main:scripts/inbox_sweep.py | sha256sum
          git show origin/main:scripts/lint_outbox.py | sha256sum
          echo '=== revive ==='
          WHO=chatgpt_1 ./scripts/agent-revive.sh
          echo '=== mark ==='
          python3 scripts/inbox_sweep.py --me chatgpt_1 --mark
          echo '=== lint ==='
          python3 scripts/lint_outbox.py --author chatgpt_1
