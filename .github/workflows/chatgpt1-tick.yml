name: chatgpt_1 authoritative inbox tick

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tick.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Finalize tick
        run: python3 chatgpt_1/tick_finalize.py
