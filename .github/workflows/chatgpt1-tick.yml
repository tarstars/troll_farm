name: chatgpt_1 authoritative inbox tick

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-tick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Diagnose authoritative sweep, mark, and outbox lint
        shell: bash
        run: |
          set +e
          git fetch origin main agent/chatgpt_1
          fetch_rc=$?
          python3 scripts/inbox_sweep.py --me chatgpt_1 --fetch > /tmp/sweep.log 2>&1
          sweep_rc=$?
          python3 scripts/inbox_sweep.py --me chatgpt_1 --mark > /tmp/mark.log 2>&1
          mark_rc=$?
          python3 scripts/lint_outbox.py --author chatgpt_1 > /tmp/lint.log 2>&1
          lint_rc=$?
          printf 'FETCH_RC=%s\nSWEEP_RC=%s\nMARK_RC=%s\nLINT_RC=%s\n' "$fetch_rc" "$sweep_rc" "$mark_rc" "$lint_rc"
          echo '=== SWEEP SUMMARY ==='
          grep -E '^(agent:|authority:|seen-state:|immutable-path collisions|delivery errors|quarantine errors|new \(unseen\)|unacknowledged, ack required|wake set)' /tmp/sweep.log || true
          echo '=== MARK SUMMARY ==='
          grep -E '^(agent:|authority:|seen-state:|immutable-path collisions|delivery errors|quarantine errors|new \(unseen\)|unacknowledged, ack required|wake set|marked |mark skipped)' /tmp/mark.log || true
          echo '=== LINT TAIL ==='
          tail -n 40 /tmp/lint.log
          exit 0
