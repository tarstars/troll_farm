name: temporary chatgpt_1 detector bite-test audit review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  reproduce:
    if: github.head_ref == 'agent/chatgpt_1-actions-trigger-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9817d1733744acdd1a2094327a291cb9ce623f6
          fetch-depth: 0
          lfs: false
      - name: Run exact detector tests and corrected probes
        run: |
          cd claude_1/banana-restoration-r2
          python3 -m unittest test_trace_detectors -v
          PYTHONPATH=.:bitetest-audit python3 -m unittest probes -v
          PYTHONPATH=.:bitetest-audit python3 bitetest-audit/probes.py \
            --json /tmp/probe-results.json
          cmp /tmp/probe-results.json bitetest-audit/results/probe-results.json
          PYTHONPATH=. python3 bitetest-audit/probe_corpus.py --counts
      - name: Reproduce the complete mutation experiment
        run: |
          cd claude_1/banana-restoration-r2
          python3 bitetest-audit/run_mutations.py --out /tmp/mutation-results.json
          python3 - <<'PY'
          import json
          committed=json.load(open('bitetest-audit/results/mutation-results.json'))
          fresh=json.load(open('/tmp/mutation-results.json'))
          assert fresh['control']['green'] is True
          expected={
            'manifest_entries': 65,
            'mutants_declared': 64,
            'mutants_run': 64,
            'patch_failed': 0,
            'compile_failed': 0,
            'caught': 21,
            'survived': 43,
            'caught_by_expected': 21,
            'caught_only_by_other_detector': 0,
            'live_survivors': 30,
            'unwitnessed': 13,
          }
          for k,v in expected.items():
              assert fresh['totals'][k] == v, (k, fresh['totals'][k], v)
          assert fresh['per_detector'] == committed['per_detector']
          stable=('id','detector','file','intent','excluded_from_totals','matches',
                  'status','caught','caught_by_expected','caught_only_by_other_detector',
                  'liveness','probe_changed_detectors','mutated_sha256','note')
          def rows(doc):
              return [{k:r.get(k) for k in stable} for r in doc['mutants']]
          assert rows(fresh) == rows(committed)
          assert fresh['excluded_entries'] == committed['excluded_entries']
          print('totals=', fresh['totals'])
          print('per_detector=', fresh['per_detector'])
          PY
