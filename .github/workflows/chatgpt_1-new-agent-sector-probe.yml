name: chatgpt_1 new-agent live sector analysis

on:
  push:
    branches:
      - agent/chatgpt_1-new-agent-sector-6590141
    paths:
      - .github/workflows/chatgpt_1-new-agent-sector-probe.yml
      - chatgpt_1/new_agent_sector_6590141_collect.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1-new-agent-sector-6590141

      - name: Show toolchain
        run: python3 --version

      - name: Collect exact public games and repeat frozen sector analysis
        run: |
          python3 chatgpt_1/new_agent_sector_6590141_collect.py \
            --jobs 8 \
            --bootstrap 50000

      - name: Record hashes and basic output integrity
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path = Path('chatgpt_1/new-agent-6590141-live-sector-games-2026-08-02.csv')
          json_path = Path('chatgpt_1/new-agent-6590141-live-sector-analysis-2026-08-02.json')
          rows = list(csv.DictReader(csv_path.open()))
          report = json.loads(json_path.read_text())
          assert len(rows) == report['identity']['matching_finished']
          assert all(int(row['game_id']) > 0 for row in rows)
          assert report['identity']['agent_id'] == 6590141
          assert report['identity']['submission_id'] == 41081503
          print('rows', len(rows), 'selected', report['support']['selected_games'])
          PY
          sha256sum \
            chatgpt_1/new-agent-6590141-live-sector-games-2026-08-02.csv \
            chatgpt_1/new-agent-6590141-live-sector-analysis-2026-08-02.json \
            > chatgpt_1/new-agent-6590141-live-sector-SHA256SUMS-2026-08-02.txt
          cat chatgpt_1/new-agent-6590141-live-sector-SHA256SUMS-2026-08-02.txt

      - name: Commit compact results to agent branch
        run: |
          git config user.name "chatgpt_1 sector audit"
          git config user.email "noreply@openai.com"
          git add -- \
            chatgpt_1/new-agent-6590141-live-sector-games-2026-08-02.csv \
            chatgpt_1/new-agent-6590141-live-sector-analysis-2026-08-02.json \
            chatgpt_1/new-agent-6590141-live-sector-SHA256SUMS-2026-08-02.txt
          if git diff --cached --quiet; then
            echo "analysis outputs unchanged"
          else
            git commit -m "data: publish exact new-agent live sector analysis"
            git push origin HEAD:agent/chatgpt_1-new-agent-sector-6590141
          fi
