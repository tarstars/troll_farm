name: banana zero-oscillation gate

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve
    paths:
      - "chatgpt_1/banana-solve/**"
      - "claude_1/banana-restoration-r2/**"
      - "claude_1/pipeline/**"
      - ".github/workflows/chatgpt-banana-zero-oscillation.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit containing the candidate
        required: true
        default: agent/chatgpt_1-banana-solve

permissions:
  contents: read

concurrency:
  group: banana-zero-oscillation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Build, compile, and run pinned gate
        id: gate
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/chatgpt_1/banana-solve/ci/zero-oscillation-main"
          CAND="$ROOT/chatgpt_1/banana-solve/candidate-banana-r2.min.rs"
          CONTRACT="$ROOT/chatgpt_1/banana-solve/gate-contract-v1.json"
          mkdir -p "$OUT"
          rm -rf "$OUT"/* /tmp/banana-zero-pinned
          FAILED=0

          run_step() {
            local name="$1"; shift
            echo "== $name ==" | tee -a "$OUT/run.log"
            "$@" >> "$OUT/run.log" 2>&1
            local code=$?
            echo "${name// /_}_exit=$code" | tee -a "$OUT/run.log"
            if [ "$code" -ne 0 ]; then FAILED=1; fi
          }

          {
            echo "candidate_ref=${{ inputs.ref || github.ref_name }}"
            echo "candidate_commit=$GITHUB_SHA"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "python=$(python3 --version 2>&1)"
            echo "rustc=$(rustc --version 2>&1)"
          } > "$OUT/run.log"

          run_step "candidate build" \
            python3 "$ROOT/chatgpt_1/banana-solve/build_candidate_v11.py"
          run_step "candidate compile" \
            rustc --crate-name banana_candidate --edition=2021 -O \
              "$CAND" -o /tmp/banana-zero-candidate
          run_step "trace detector tests" \
            python3 -m unittest discover \
              -s "$ROOT/claude_1/banana-restoration-r2" \
              -p test_trace_detectors.py
          run_step "owner contract" \
            python3 "$ROOT/chatgpt_1/banana-solve/owner_contract_final_adapter.py" \
              --candidate "$CAND" \
              --output "$OUT/owner-contract"

          git fetch origin agent/claude_1 >> "$OUT/run.log" 2>&1
          git worktree add --detach /tmp/banana-zero-pinned \
            b16f44d62caa9802253adaf255eb07b98273421b \
            >> "$OUT/run.log" 2>&1
          if [ "$?" -ne 0 ]; then FAILED=1; fi

          PINNED_CFG="$OUT/pinned-config.json"
          cp /tmp/banana-zero-pinned/claude_1/pipeline/fuzz-panel-config.json \
            "$PINNED_CFG"
          python3 - "$PINNED_CFG" "$CAND" \
            /tmp/banana-zero-pinned/cgauto/submissions/candidate-agent6553250-preseed-orchard-coverage-slim.min.rs <<'PY'
          import hashlib, json, pathlib, sys
          config_path, candidate, parent = map(pathlib.Path, sys.argv[1:])
          config = json.loads(config_path.read_text())
          config['task'] = '20260802-banana-restoration-r2 zero-oscillation gate v1'
          config['candidate']['source'] = str(candidate.resolve())
          config['candidate']['sha256'] = hashlib.sha256(candidate.read_bytes()).hexdigest()
          config['candidate']['crate'] = 'chatgpt_1_banana_zero_oscillation'
          config['parent']['source'] = str(parent.resolve())
          config['parent']['sha256'] = hashlib.sha256(parent.read_bytes()).hexdigest()
          config['games_dir'] = '/tmp/banana-zero-oscillation/games'
          config['bin_cache_dir'] = '/tmp/banana-zero-oscillation/bin'
          config_path.write_text(json.dumps(config, indent=2, sort_keys=True) + '\n')
          PY
          if [ "$?" -ne 0 ]; then FAILED=1; fi

          run_step "stable pinned gate" \
            python3 "$ROOT/chatgpt_1/banana-solve/run_stable_gate.py" \
              --panel-file /tmp/banana-zero-pinned/claude_1/pipeline/fuzz_panel.py \
              --config "$PINNED_CFG" \
              --gate-contract "$CONTRACT" \
              --report "$OUT/stable-gate.md" \
              --json "$OUT/stable-gate.json" \
              --save-failures "$OUT/failures"

          python3 - "$CAND" "$OUT" <<'PY' >> "$OUT/run.log" 2>&1
          import hashlib, json, pathlib, sys
          candidate = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          summary = {
              'candidate_bytes': candidate.stat().st_size if candidate.exists() else None,
              'candidate_sha256': hashlib.sha256(candidate.read_bytes()).hexdigest() if candidate.exists() else None,
              'candidate_commit': __import__('os').environ.get('GITHUB_SHA'),
          }
          for name, path in {
              'stable_gate': out / 'stable-gate.json',
              'owner_contract': out / 'owner-contract' / 'owner-contract-results.json',
          }.items():
              if path.exists():
                  payload = json.loads(path.read_text())
                  summary[name] = payload.get('verdict')
                  if name == 'stable_gate':
                      summary['hard_stability'] = payload.get('hard_stability')
                      summary['sha_binding'] = payload.get('sha_binding')
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          exit "$FAILED"

      - name: Upload exact gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banana-zero-oscillation-${{ github.sha }}
          path: |
            chatgpt_1/banana-solve/ci/zero-oscillation-main
            chatgpt_1/banana-solve/candidate-banana-r2.min.rs
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs
          if-no-files-found: warn
          retention-days: 30
