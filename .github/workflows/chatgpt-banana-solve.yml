name: chatgpt banana solve

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve

permissions:
  contents: write

jobs:
  discover-and-baseline:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip banana-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Baseline discovery and validation
        shell: bash
        run: |
          set +e
          mkdir -p chatgpt_1/banana-solve/ci
          OUT=chatgpt_1/banana-solve/ci/latest.txt
          : > "$OUT"
          {
            echo "commit=$GITHUB_SHA"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== files =="
            find claude_1/banana-restoration-r2 -maxdepth 3 -type f -printf '%p\n' | sort
            echo
            echo "== toolchain =="
            python3 --version
            rustc --version
            cargo --version
            echo
            echo "== candidate build =="
          } >> "$OUT" 2>&1
          python3 claude_1/banana-restoration-r2/build_banana_candidate.py >> "$OUT" 2>&1
          echo "build_exit=$?" >> "$OUT"
          echo >> "$OUT"
          echo "== oracle self-test ==" >> "$OUT"
          python3 claude_1/banana-restoration-r2/conversion_race_oracle.py >> "$OUT" 2>&1
          echo "oracle_exit=$?" >> "$OUT"
          echo >> "$OUT"
          echo "== likely test entrypoints ==" >> "$OUT"
          find claude_1/banana-restoration-r2 -maxdepth 3 -type f \( -name '*test*.py' -o -name '*gate*.py' -o -name '*harness*.py' -o -name '*fuzz*.py' \) -printf '%p\n' | sort >> "$OUT"
          echo >> "$OUT"
          echo "== compile candidate ==" >> "$OUT"
          rustc --edition=2021 -O claude_1/banana-restoration-r2/candidate-banana-r2.min.rs -o /tmp/banana-candidate >> "$OUT" 2>&1
          echo "compile_exit=$?" >> "$OUT"
          echo >> "$OUT"
          echo "== smoke empty input ==" >> "$OUT"
          timeout 5s /tmp/banana-candidate </dev/null >/tmp/banana.stdout 2>/tmp/banana.stderr
          echo "smoke_exit=$? stdout_bytes=$(wc -c </tmp/banana.stdout) stderr_bytes=$(wc -c </tmp/banana.stderr)" >> "$OUT"
          cat /tmp/banana.stderr >> "$OUT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$OUT" claude_1/banana-restoration-r2/candidate-banana-r2.min.rs claude_1/banana-restoration-r2/candidate-banana-r2-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record banana baseline [skip banana-ci]"
            git push
          fi
