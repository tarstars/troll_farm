name: chatgpt banana solve

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip banana-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and run zero-oscillation gate
        shell: bash
        run: |
          set +e
          mkdir -p chatgpt_1/banana-solve/ci
          OUT=chatgpt_1/banana-solve/ci/latest.txt
          CAND=chatgpt_1/banana-solve/candidate-banana-r2.min.rs
          PARENT=cgauto/submissions/candidate-agent6553250-preseed-orchard-coverage-slim.min.rs
          CONTRACT=chatgpt_1/banana-solve/gate-contract-v1.json
          FAILED=0
          : > "$OUT"
          rm -rf \
            chatgpt_1/banana-solve/ci/failures \
            chatgpt_1/banana-solve/ci/stable-gate-failures \
            chatgpt_1/banana-solve/ci/owner-contract

          run_gate() {
            local name="$1"; shift
            echo >> "$OUT"
            echo "== $name ==" >> "$OUT"
            "$@" >> "$OUT" 2>&1
            local code=$?
            echo "${name// /_}_exit=$code" >> "$OUT"
            if [ "$code" -ne 0 ]; then FAILED=1; fi
            return 0
          }

          {
            echo "commit=$GITHUB_SHA"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "python=$(python3 --version 2>&1)"
            echo "rustc=$(rustc --version 2>&1)"
            echo "gate_contract_sha256=$(sha256sum "$CONTRACT" | cut -d' ' -f1)"
          } >> "$OUT"

          run_gate "candidate build" python3 chatgpt_1/banana-solve/build_candidate_v11.py
          run_gate "oracle selftest" python3 claude_1/banana-restoration-r2/conversion_race_oracle.py
          run_gate "compile candidate" rustc --crate-name banana_candidate --edition=2021 -O "$CAND" -o /tmp/banana-candidate

          echo >> "$OUT"
          echo "== smoke empty input ==" >> "$OUT"
          timeout 5s /tmp/banana-candidate </dev/null >/tmp/banana.stdout 2>/tmp/banana.stderr
          smoke=$?
          echo "smoke_exit=$smoke stdout_bytes=$(wc -c </tmp/banana.stdout) stderr_bytes=$(wc -c </tmp/banana.stderr)" >> "$OUT"
          cat /tmp/banana.stderr >> "$OUT"
          if [ "$smoke" -ne 0 ] || [ -s /tmp/banana.stderr ]; then FAILED=1; fi

          run_gate "trace detector tests" python3 -m unittest discover -s claude_1/banana-restoration-r2 -p test_trace_detectors.py
          run_gate "owner contract" python3 chatgpt_1/banana-solve/owner_contract_final_adapter.py --candidate "$CAND" --output chatgpt_1/banana-solve/ci/owner-contract

          # Materialize the exact reviewer-pinned map generator and detector set.
          git fetch origin agent/claude_1
          rm -rf /tmp/banana-standing-gate
          git worktree add --detach /tmp/banana-standing-gate b16f44d62caa9802253adaf255eb07b98273421b >> "$OUT" 2>&1
          PINNED_CFG="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/stable-gate-config.json"
          cp /tmp/banana-standing-gate/claude_1/pipeline/fuzz-panel-config.json "$PINNED_CFG"
          python3 - "$PINNED_CFG" "$GITHUB_WORKSPACE/$CAND" \
            /tmp/banana-standing-gate/cgauto/submissions/candidate-agent6553250-preseed-orchard-coverage-slim.min.rs <<'PY'
          import hashlib, json, pathlib, sys
          cfg_path, candidate, parent = map(pathlib.Path, sys.argv[1:])
          candidate_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
          parent_sha = hashlib.sha256(parent.read_bytes()).hexdigest()
          assert parent_sha == 'a8eb3b2bb646c59baf4c0a8b6bbdd9ca626e20ab2a27553dadbded047b884e55', parent_sha
          cfg = json.loads(cfg_path.read_text())
          cfg['task'] = '20260802-banana-restoration-r2 stable zero-oscillation gate'
          cfg['candidate']['source'] = str(candidate)
          cfg['candidate']['sha256'] = candidate_sha
          cfg['candidate']['crate'] = 'chatgpt_1_banana_r2_zero_oscillation'
          cfg['parent']['source'] = str(parent)
          cfg['parent']['sha256'] = parent_sha
          cfg['games_dir'] = '/tmp/chatgpt-banana-stable/games'
          cfg['bin_cache_dir'] = '/tmp/chatgpt-banana-stable/bin'
          cfg_path.write_text(json.dumps(cfg, indent=2, sort_keys=True) + '\n')
          PY

          run_gate "stable pinned gate" \
            python3 chatgpt_1/banana-solve/run_stable_gate.py \
              --panel-file /tmp/banana-standing-gate/claude_1/pipeline/fuzz_panel.py \
              --gate-contract "$CONTRACT" \
              --config "$PINNED_CFG" \
              --report chatgpt_1/banana-solve/ci/stable-gate.md \
              --json chatgpt_1/banana-solve/ci/stable-gate.json \
              --save-failures chatgpt_1/banana-solve/ci/stable-gate-failures

          python3 - <<'PY' >> "$OUT" 2>&1
          import hashlib, json
          from pathlib import Path
          candidate = Path('chatgpt_1/banana-solve/candidate-banana-r2.min.rs')
          stable = json.loads(Path('chatgpt_1/banana-solve/ci/stable-gate.json').read_text())
          owner = json.loads(Path('chatgpt_1/banana-solve/ci/owner-contract/owner-contract-results.json').read_text())
          summary = {
              'candidate_bytes': candidate.stat().st_size,
              'candidate_sha256': hashlib.sha256(candidate.read_bytes()).hexdigest(),
              'owner_contract': owner.get('verdict'),
              'stable_gate_verdict': stable.get('verdict'),
              'hard_stability_summary': stable.get('hard_stability_summary'),
              'sha_binding': stable.get('sha_binding'),
          }
          Path('chatgpt_1/banana-solve/ci/stable-gate-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('\n== final summary ==')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            "$OUT" \
            chatgpt_1/banana-solve/ci \
            "$CAND" \
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json \
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs
          if ! git diff --cached --quiet; then
            git commit -m "ci: record zero-oscillation gate [skip banana-ci]"
            git pull --rebase origin agent/chatgpt_1-banana-solve
            git push origin HEAD:agent/chatgpt_1-banana-solve
          fi
          exit "$FAILED"
