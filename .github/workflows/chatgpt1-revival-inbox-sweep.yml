name: chatgpt1-revival-inbox-sweep

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-revival-inbox-sweep.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical agent branch
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Run authoritative branch-aware sweep and retain output
        shell: bash
        run: |
          set -u
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --prune origin
          out='chatgpt_1/verification/revival-inbox-sweep-2026-08-22.txt'
          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_1 --fetch > "$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          printf '\nSWEEP_EXIT=%s\n' "$rc" >> "$out"
          git config user.name 'chatgpt_1'
          git config user.email 'chatgpt_1@users.noreply.github.com'
          git add "$out"
          git rm .github/workflows/chatgpt1-revival-inbox-sweep.yml
          git commit -m 'revival proof: record authoritative inbox sweep [skip ci]'
          git push origin HEAD:agent/chatgpt_1
