name: publish final banana packet to canonical chatgpt_1

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve
    paths:
      - chatgpt_1/banana-solve/CANONICAL-PUBLISH-TRIGGER

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy frozen final packet onto agent/chatgpt_1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/chatgpt_1 agent/chatgpt_1-banana-solve
          WORK_REF=origin/agent/chatgpt_1-banana-solve
          git checkout -B agent/chatgpt_1 origin/agent/chatgpt_1
          paths=(
            chatgpt_1/banana-solve/candidate-banana-r2.min.rs
            chatgpt_1/banana-solve/candidate-banana-r2-manifest.json
            chatgpt_1/banana-solve/build_candidate.py
            chatgpt_1/banana-solve/build_candidate_v3.py
            chatgpt_1/banana-solve/build_candidate_v4.py
            chatgpt_1/banana-solve/generated/banana_blocks/block-i1.rs
            chatgpt_1/banana-solve/validation-report-2026-08-06.md
            chatgpt_1/banana-solve/analyze_pinned_attribution.py
            chatgpt_1/banana-solve/run_corrected_pinned.py
            chatgpt_1/banana-solve/ci/pinned-repro-bbe54a48.log
            chatgpt_1/banana-solve/ci/pinned-repro-bbe54a48-inputs.json
            chatgpt_1/banana-solve/ci/pinned-repro-bbe54a48-attribution.json
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48-config.json
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.json
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.md
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.log
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48-summary.json
            chatgpt_1/banana-solve/ci/owner-contract/owner-contract-results.json
            chatgpt_1/banana-solve/ci/regression-adapted.json
            chatgpt_1/banana-solve/ci/semantic-adapted.json
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$WORK_REF:$path" > "$path"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt_1/banana-solve
          if git diff --cached --quiet; then
            echo "canonical packet already identical"
            exit 0
          fi
          git commit -m "banana: publish frozen R2 implementation packet"
          git push origin HEAD:agent/chatgpt_1
