name: chatgpt2-tick

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chatgpt_2
    paths:
      - .github/workflows/chatgpt2-tick.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all authoritative refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Mark processed chatgpt_2 inbox
        run: |
          set -euo pipefail
          python3 scripts/inbox_sweep.py --me chatgpt_2 --mark | tee inbox-tick-mark.log
          test -f chatgpt_2/inbox-seen.json
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt2-tick-mark
          path: |
            inbox-tick-mark.log
            chatgpt_2/inbox-seen.json
          if-no-files-found: error
