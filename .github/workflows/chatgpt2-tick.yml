name: chatgpt2-tick

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chatgpt_2
    paths:
      - .github/workflows/chatgpt2-tick.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all authoritative refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Run authoritative inbox sweep
        run: |
          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_2 | tee inbox-tick.log
          rc=${PIPESTATUS[0]}
          echo "sweep_exit=$rc"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt2-tick-inbox
          path: inbox-tick.log
          if-no-files-found: error
