name: chatgpt_1 champion-prefix orchard oracle

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - "chatgpt_1/champion-prefix-orchard/**"
      - ".github/workflows/chatgpt1-champion-prefix-orchard.yml"

permissions:
  contents: write

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Run exact paired orchard oracle
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash chatgpt_1/champion-prefix-orchard/run.sh 2>&1 | tee /tmp/champion-prefix-orchard.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/champion-prefix-orchard.rc
          exit 0
      - name: Publish execution evidence and source repairs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIR=chatgpt_1/champion-prefix-orchard
          mkdir -p "$DIR/results"
          cp /tmp/champion-prefix-orchard.log "$DIR/results/workflow.log" || true
          printf '%s\n' "$(cat /tmp/champion-prefix-orchard.rc 2>/dev/null || echo 99)" \
            > "$DIR/results/workflow-exit-code.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DIR"
          if ! git diff --cached --quiet; then
            git commit -m "chatgpt_1: record champion-prefix orchard oracle [skip ci]"
            git push origin HEAD:agent/chatgpt_1
          fi
      - name: Enforce instrument success
        shell: bash
        run: test "$(cat /tmp/champion-prefix-orchard.rc)" -eq 0
