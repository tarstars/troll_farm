name: chatgpt1-rust-anytime-ci

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - 'chatgpt_1/opening-dp-oracle/rust-anytime/**'
      - '.github/workflows/chatgpt1-rust-anytime-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chatgpt_1/opening-dp-oracle/rust-anytime
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Toolchain identity
        run: rustc --version && cargo --version
      - name: Apply compiler-directed type annotation
        run: sed -i 's/let mut optimistic_bank =/let mut optimistic_bank: [u16; 4] =/' src/model.rs
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Verify canonical formatting
        run: cargo fmt --all -- --check
      - name: Debug tests
        run: cargo test --all-targets
      - name: Release parity benchmark
        run: /usr/bin/time -v cargo test --release larger_two_stage_case_is_19 -- --ignored --nocapture
      - name: Small exact cases
        run: cargo run --release -- small
      - name: Large proof benchmark
        run: /usr/bin/time -v cargo run --release -- bench
      - name: Online budget curve
        run: cargo run --release -- online
      - name: Publish verified source changes
        working-directory: .
        run: |
          if git diff --quiet -- chatgpt_1/opening-dp-oracle/rust-anytime; then
            echo "No source changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_1/opening-dp-oracle/rust-anytime
          git commit -m "chatgpt_1: apply verified Rust compiler and rustfmt fixes"
          git push origin HEAD:agent/chatgpt_1
          echo "published_commit=$(git rev-parse HEAD)"
