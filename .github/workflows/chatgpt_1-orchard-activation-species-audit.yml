name: chatgpt_1 orchard activation and species audit

on:
  push:
    branches:
      - agent/chatgpt_1-orchard-activation-species-audit
    paths:
      - .github/workflows/chatgpt_1-orchard-activation-species-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out analysis branch with LFS
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1-orchard-activation-species-audit
          fetch-depth: 10
          lfs: true

      - name: Materialize exact replay packages
        run: |
          git lfs pull --include='data/shared-lfs/orchard-ab-night-20260803/**'
          test "$(find data/shared-lfs/orchard-ab-night-20260803 -name 'games-*.jsonl.gz' -type f | wc -l)" -eq 8

      - name: Restore and patch the syntax-checked analyzer
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          old = subprocess.check_output([
              'git', 'show',
              '87c3e5667dc619f85a315eb270a1fbef422ea1e4:.github/workflows/chatgpt_1-orchard-activation-species-audit.yml',
          ], text=True)
          match = re.search(r"<<'B64'\n([A-Za-z0-9+/=\n]+)\nB64", old)
          if not match:
              raise SystemExit('preserved analyzer payload not found')
          source = gzip.decompress(base64.b64decode(match.group(1))).decode()

          old_rustc = '["rustc", "-O", str(source), "-o", str(binary)]'
          new_rustc = '["rustc", "--edition=2021", "--crate-name", "orchard_audit", "-O", str(source), "-o", str(binary)]'
          if source.count(old_rustc) != 1:
              raise SystemExit('rustc command anchor not unique')
          source = source.replace(old_rustc, new_rustc, 1)

          old_parity = '''    if outputs[deployed_name] != recorded:
        mismatch = first_divergence(outputs[deployed_name], recorded)
        raise RuntimeError(
            f"game {replay['gameId']} deployed parity failed at turn "
            f"{None if mismatch is None else mismatch + 1}: "
            f"bot={outputs[deployed_name][mismatch or 0]} recorded={recorded[mismatch or 0]}"
        )
'''
          new_parity = '''    deployed_mismatch_index = first_divergence(outputs[deployed_name], recorded)
'''
          if source.count(old_parity) != 1:
              raise SystemExit('deployed parity block anchor not unique')
          source = source.replace(old_parity, new_parity, 1)

          old_activation = '''    activation_indices = {
        "current_apple": first_divergence(outputs["apple_current"], baseline),
        "apple_idle": first_divergence(outputs["apple_idle"], baseline),
        "banana": first_divergence(outputs["banana_current"], baseline),
        "banana_idle": first_divergence(outputs["banana_idle"], baseline),
    }
    # Only divergences through turn 100 can be orchard activation; fail closed on later first changes.
    for name, index in activation_indices.items():
        if index is not None and index >= 100:
            raise RuntimeError(f"game {replay['gameId']} {name} first diverges after orchard window")
'''
          new_activation = '''    raw_activation_indices = {
        "current_apple": first_divergence(outputs["apple_current"], baseline),
        "apple_idle": first_divergence(outputs["apple_idle"], baseline),
        "banana": first_divergence(outputs["banana_current"], baseline),
        "banana_idle": first_divergence(outputs["banana_idle"], baseline),
    }
    activation_indices = {}
    for name, index in raw_activation_indices.items():
        exact_prefix = (
            index is not None
            and index < 100
            and (deployed_mismatch_index is None or index < deployed_mismatch_index)
        )
        # On orchard-deployed trajectories, generated idle/BANANA states cease to be
        # exact after the current APPLE arm diverges. Those alternatives are measured
        # on the 640 no-orchard trajectories instead.
        if deployed_variant == "orchard" and name != "current_apple":
            exact_prefix = False
        activation_indices[name] = index if exact_prefix else None
'''
          if source.count(old_activation) != 1:
              raise SystemExit('activation block anchor not unique')
          source = source.replace(old_activation, new_activation, 1)

          old_csv = '''    "deployed_variant",
    "seat",
'''
          new_csv = '''    "deployed_variant",
    "deployed_first_mismatch_turn",
    "seat",
'''
          if source.count(old_csv) != 1:
              raise SystemExit('CSV field anchor not unique')
          source = source.replace(old_csv, new_csv, 1)

          old_return = '''        "deployed_variant": deployed_variant,
        "seat": seat,
'''
          new_return = '''        "deployed_variant": deployed_variant,
        "deployed_first_mismatch_turn": (
            None if deployed_mismatch_index is None else deployed_mismatch_index + 1
        ),
        "seat": seat,
'''
          if source.count(old_return) != 1:
              raise SystemExit('row return anchor not unique')
          source = source.replace(old_return, new_return, 1)

          old_quality = '''            "deployed_command_parity_games": len(rows),
            "packages": 8,
'''
          new_quality = '''            "deployed_command_parity_games": sum(
                row["deployed_first_mismatch_turn"] is None for row in rows
            ),
            "deployed_prefix_exact_through_turn_100_games": sum(
                row["deployed_first_mismatch_turn"] is None
                or int(row["deployed_first_mismatch_turn"]) > 100
                for row in rows
            ),
            "packages": 8,
'''
          if source.count(old_quality) != 1:
              raise SystemExit('quality block anchor not unique')
          source = source.replace(old_quality, new_quality, 1)

          path = Path('chatgpt_1/orchard_activation_species_audit.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(source)
          print('restored', len(source.encode()), 'bytes', len(source.splitlines()), 'lines')
          PY
          chmod +x chatgpt_1/orchard_activation_species_audit.py
          python3 -m py_compile chatgpt_1/orchard_activation_species_audit.py

      - name: Run exact 1,280-game audit
        shell: bash
        run: |
          set +e
          python3 chatgpt_1/orchard_activation_species_audit.py --jobs 4 \
            > chatgpt_1/orchard-activation-species-audit-run.log 2>&1
          status=$?
          echo "$status" > chatgpt_1/orchard-activation-species-audit-exit.txt
          cat chatgpt_1/orchard-activation-species-audit-run.log
          exit 0

      - name: Record output hashes
        shell: bash
        run: |
          set +e
          files=(
            chatgpt_1/orchard_activation_species_audit.py
            chatgpt_1/orchard-activation-opportunities-2026-08-04.csv
            chatgpt_1/orchard-activation-species-audit-2026-08-04.json
            chatgpt_1/orchard-activation-species-audit-2026-08-04.md
          )
          present=()
          for file in "${files[@]}"; do
            if test -f "$file"; then present+=("$file"); fi
          done
          sha256sum "${present[@]}" > chatgpt_1/orchard-activation-species-audit-SHA256SUMS-2026-08-04.txt

      - name: Commit audit outputs or diagnostics
        shell: bash
        run: |
          git config user.name 'chatgpt_1 orchard audit'
          git config user.email 'noreply@openai.com'
          git add -A -- chatgpt_1
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: publish orchard activation and species audit'
            git push origin HEAD:agent/chatgpt_1-orchard-activation-species-audit
          fi
          exit "$(cat chatgpt_1/orchard-activation-species-audit-exit.txt)"
