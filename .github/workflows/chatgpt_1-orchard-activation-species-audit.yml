name: chatgpt_1 orchard activation and species audit

on:
  push:
    branches:
      - agent/chatgpt_1-orchard-activation-species-audit
    paths:
      - .github/workflows/chatgpt_1-orchard-activation-species-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out analysis branch with LFS
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1-orchard-activation-species-audit
          fetch-depth: 1
          lfs: true

      - name: Materialize exact replay packages
        run: |
          git lfs pull --include='data/shared-lfs/orchard-ab-night-20260803/**'
          find data/shared-lfs/orchard-ab-night-20260803 -name 'games-*.jsonl.gz' -type f -print

      - name: Restore analysis script
        run: |
          cat > /tmp/orchard-audit.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/orchard-audit.py.gz.b64 | gzip -dc > chatgpt_1/orchard_activation_species_audit.py
          chmod +x chatgpt_1/orchard_activation_species_audit.py
          python3 -m py_compile chatgpt_1/orchard_activation_species_audit.py

      - name: Run exact 1,280-game audit
        id: run_audit
        shell: bash
        run: |
          set +e
          python3 chatgpt_1/orchard_activation_species_audit.py --jobs 4 \
            > chatgpt_1/orchard-activation-species-audit-run.log 2>&1
          status=$?
          echo "$status" > chatgpt_1/orchard-activation-species-audit-exit.txt
          cat chatgpt_1/orchard-activation-species-audit-run.log
          exit 0

      - name: Record output hashes
        shell: bash
        run: |
          set +e
          sha256sum \
            chatgpt_1/orchard_activation_species_audit.py \
            chatgpt_1/orchard-activation-opportunities-2026-08-04.csv \
            chatgpt_1/orchard-activation-species-audit-2026-08-04.json \
            chatgpt_1/orchard-activation-species-audit-2026-08-04.md \
            > chatgpt_1/orchard-activation-species-audit-SHA256SUMS-2026-08-04.txt
          true

      - name: Commit audit outputs or diagnostics
        shell: bash
        run: |
          git config user.name 'chatgpt_1 orchard audit'
          git config user.email 'noreply@openai.com'
          git add -A -- chatgpt_1
          if git diff --cached --quiet; then
            echo 'no audit changes'
          else
            git commit -m 'analysis: publish orchard activation and species audit'
            git push origin HEAD:agent/chatgpt_1-orchard-activation-species-audit
          fi
          status=$(cat chatgpt_1/orchard-activation-species-audit-exit.txt)
          exit "$status"
