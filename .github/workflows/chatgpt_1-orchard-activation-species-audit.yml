name: chatgpt_1 orchard activation and species audit

on:
  push:
    branches:
      - agent/chatgpt_1-orchard-activation-species-audit
    paths:
      - .github/workflows/chatgpt_1-orchard-activation-species-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out analysis branch with LFS
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1-orchard-activation-species-audit
          fetch-depth: 10
          lfs: true

      - name: Materialize exact replay packages
        run: |
          git lfs pull --include='data/shared-lfs/orchard-ab-night-20260803/**'
          test "$(find data/shared-lfs/orchard-ab-night-20260803 -name 'games-*.jsonl.gz' -type f | wc -l)" -eq 8

      - name: Restore and patch the syntax-checked analyzer
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          old = subprocess.check_output([
              'git', 'show',
              '87c3e5667dc619f85a315eb270a1fbef422ea1e4:.github/workflows/chatgpt_1-orchard-activation-species-audit.yml',
          ], text=True)
          match = re.search(r"<<'B64'\n([A-Za-z0-9+/=\n]+)\nB64", old)
          if not match:
              raise SystemExit('preserved analyzer payload not found')
          source = gzip.decompress(base64.b64decode(match.group(1))).decode()
          old_rustc = '["rustc", "-O", str(source), "-o", str(binary)]'
          new_rustc = '["rustc", "--edition=2021", "-O", str(source), "-o", str(binary)]'
          if source.count(old_rustc) != 1:
              raise SystemExit('rustc command anchor not unique')
          source = source.replace(old_rustc, new_rustc, 1)
          path = Path('chatgpt_1/orchard_activation_species_audit.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(source)
          print('restored', len(source.encode()), 'bytes', len(source.splitlines()), 'lines')
          PY
          chmod +x chatgpt_1/orchard_activation_species_audit.py
          python3 -m py_compile chatgpt_1/orchard_activation_species_audit.py

      - name: Run exact 1,280-game audit
        shell: bash
        run: |
          set +e
          python3 chatgpt_1/orchard_activation_species_audit.py --jobs 4 \
            > chatgpt_1/orchard-activation-species-audit-run.log 2>&1
          status=$?
          echo "$status" > chatgpt_1/orchard-activation-species-audit-exit.txt
          cat chatgpt_1/orchard-activation-species-audit-run.log
          exit 0

      - name: Record output hashes
        shell: bash
        run: |
          set +e
          files=(
            chatgpt_1/orchard_activation_species_audit.py
            chatgpt_1/orchard-activation-opportunities-2026-08-04.csv
            chatgpt_1/orchard-activation-species-audit-2026-08-04.json
            chatgpt_1/orchard-activation-species-audit-2026-08-04.md
          )
          present=()
          for file in "${files[@]}"; do
            if test -f "$file"; then present+=("$file"); fi
          done
          sha256sum "${present[@]}" > chatgpt_1/orchard-activation-species-audit-SHA256SUMS-2026-08-04.txt

      - name: Commit audit outputs or diagnostics
        shell: bash
        run: |
          git config user.name 'chatgpt_1 orchard audit'
          git config user.email 'noreply@openai.com'
          git add -A -- chatgpt_1
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: publish orchard activation and species audit'
            git push origin HEAD:agent/chatgpt_1-orchard-activation-species-audit
          fi
          exit "$(cat chatgpt_1/orchard-activation-species-audit-exit.txt)"
