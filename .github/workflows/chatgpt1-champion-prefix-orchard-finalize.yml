name: chatgpt_1 finalize champion-prefix orchard

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - "chatgpt_1/champion-prefix-orchard/finalize.py"
      - ".github/workflows/chatgpt1-champion-prefix-orchard-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Render final report, close board row, and publish handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt_1/champion-prefix-orchard/finalize.py \
            | tee chatgpt_1/champion-prefix-orchard/results/finalize.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chatgpt_1: close champion-prefix orchard experiment [skip ci]"
          git push origin HEAD:agent/chatgpt_1
