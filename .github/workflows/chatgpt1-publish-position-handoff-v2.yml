name: chatgpt1-publish-position-handoff-v2

on:
  push:
    branches:
      - agent/chatgpt_1
    paths:
      - .github/workflows/chatgpt1-publish-position-handoff-v2.yml
      - chatgpt_1/staging/revival-position-handoff.md
  workflow_dispatch:

concurrency:
  group: chatgpt1-position-handoff-publication
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical agent branch
        uses: actions/checkout@v4
        with:
          ref: agent/chatgpt_1
          fetch-depth: 0
      - name: Verify, stage, lint, and publish
        shell: bash
        run: |
          set -u
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --prune origin
          test "$(git rev-parse origin/main)" = '5b31279d514d05d4374c3d983a068a6065235a7a'
          git merge-base --is-ancestor '80aab627d0b79372b69c91eaec0a9cb4766c8f37' 'origin/agent/chatgpt_1'
          git cat-file -e '80aab627d0b79372b69c91eaec0a9cb4766c8f37:chatgpt_1/architecture-position-2026-08-22.md'
          test "$(git hash-object scripts/inbox_sweep.py)" = '89b85421e117b0980926570129cd5d82c0768a50'
          test "$(git hash-object scripts/lint_outbox.py)" = '83d35e13681c5c32e2ad92b174c2a9c3de1f1c4f'
          src='chatgpt_1/staging/revival-position-handoff.md'
          path='coordination/messages/chatgpt_1/20260822T081815Z-20260822-chatgpt1-revival-handoff.md'
          log='chatgpt_1/verification/revival-position-handoff-lint-2026-08-22.txt'
          test -f "$src"
          test "$(sha256sum "$src" | cut -d' ' -f1)" = '6d5a45439a229bb1991475db58353ef07310fdd96e73eb0f3de39f7033a91ddd'
          test ! -e "$path"
          mkdir -p "$(dirname "$path")" "$(dirname "$log")"
          cp "$src" "$path"
          git add "$path"
          set +e
          python3 scripts/lint_outbox.py --me chatgpt_1 --fetch --staged > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          git config user.name 'chatgpt_1'
          git config user.email 'chatgpt_1@users.noreply.github.com'
          if [ "$rc" -eq 0 ]; then
            git add "$log"
            git rm "$src" \
              .github/workflows/chatgpt1-publish-position-handoff.yml \
              .github/workflows/chatgpt1-publish-position-handoff-v2.yml
            git commit -m 'handoff: publish fresh-eyes architecture position [skip ci]'
          else
            git reset HEAD "$path"
            rm -f "$path"
            {
              printf '\nLINT_EXIT=%s\n' "$rc"
              printf 'MESSAGE_NOT_PUBLISHED=1\n'
            } >> "$log"
            git add "$log"
            git rm "$src" \
              .github/workflows/chatgpt1-publish-position-handoff.yml \
              .github/workflows/chatgpt1-publish-position-handoff-v2.yml
            git commit -m 'blocker: record failed position-handoff lint [skip ci]'
          fi
          git push origin HEAD:agent/chatgpt_1
