name: chatgpt banana corrected pinned gate

on:
  push:
    branches:
      - agent/chatgpt_1-banana-solve
    paths:
      - .github/workflows/chatgpt-banana-corrected-pinned.yml
      - chatgpt_1/banana-solve/run_corrected_pinned.py
      - chatgpt_1/banana-solve/CORRECTED-PINNED-TRIGGER

permissions:
  contents: write

jobs:
  corrected-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run SHA-bound corrected b16f44d6 gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/claude_1
          rm -rf /tmp/banana-corrected-pinned
          git worktree add --detach /tmp/banana-corrected-pinned b16f44d62caa9802253adaf255eb07b98273421b
          mkdir -p chatgpt_1/banana-solve/ci
          rm -rf chatgpt_1/banana-solve/ci/corrected-pinned-failures-bbe54a48
          CAND="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/candidate-banana-r2.min.rs"
          PARENT="/tmp/banana-corrected-pinned/cgauto/submissions/candidate-agent6553250-preseed-orchard-coverage-slim.min.rs"
          CFG="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48-config.json"
          cp /tmp/banana-corrected-pinned/claude_1/pipeline/fuzz-panel-config.json "$CFG"
          python3 - "$CFG" "$CAND" "$PARENT" <<'PY'
          import hashlib, json, pathlib, sys
          cfg_path, candidate, parent = map(pathlib.Path, sys.argv[1:])
          candidate_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
          parent_sha = hashlib.sha256(parent.read_bytes()).hexdigest()
          assert candidate_sha == 'bbe54a489c98222d2e382b112cf26034defaf6e287b0576a1c3282438deea951', candidate_sha
          assert parent_sha == 'a8eb3b2bb646c59baf4c0a8b6bbdd9ca626e20ab2a27553dadbded047b884e55', parent_sha
          cfg = json.loads(cfg_path.read_text())
          cfg['candidate']['source'] = str(candidate)
          cfg['candidate']['sha256'] = candidate_sha
          cfg['parent']['source'] = str(parent)
          cfg['parent']['sha256'] = parent_sha
          cfg_path.write_text(json.dumps(cfg, indent=2, sort_keys=True) + '\n')
          PY
          OUT_JSON="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.json"
          OUT_MD="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.md"
          OUT_LOG="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48.log"
          FAILURES="$GITHUB_WORKSPACE/chatgpt_1/banana-solve/ci/corrected-pinned-failures-bbe54a48"
          set +e
          python3 chatgpt_1/banana-solve/run_corrected_pinned.py \
            --panel-file /tmp/banana-corrected-pinned/claude_1/pipeline/fuzz_panel.py \
            --config "$CFG" \
            --report "$OUT_MD" \
            --json "$OUT_JSON" \
            --save-failures "$FAILURES" \
            > "$OUT_LOG" 2>&1
          EXIT=$?
          set -e
          python3 - "$OUT_JSON" "$EXIT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          result = json.loads(out.read_text())
          stats = result.get('stats', result)
          summary = {
              'exit_code': exit_code,
              'verdict': result.get('verdict'),
              'blocking_games': stats.get('blocking_games'),
              'banana_activated_games': stats.get('banana_activated_games'),
              'orchard_inertness_checks_passed': stats.get('orchard_inertness_checks_passed'),
              'sha_binding': result.get('sha_binding'),
          }
          target = out.with_name('corrected-pinned-bbe54a48-summary.json')
          target.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if exit_code != 0 or summary['verdict'] != 'CLEAR' or summary['blocking_games'] != 0:
              raise SystemExit(1)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            chatgpt_1/banana-solve/ci/corrected-pinned-bbe54a48* \
            chatgpt_1/banana-solve/ci/corrected-pinned-failures-bbe54a48
          if ! git diff --cached --quiet; then
            git commit -m "ci: record SHA-bound corrected banana gate [skip banana-ci]"
            git push
          fi
