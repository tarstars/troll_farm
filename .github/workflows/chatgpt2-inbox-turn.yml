name: chatgpt2-inbox-turn

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chatgpt_2
    paths:
      - .github/workflows/chatgpt2-inbox-turn.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all authoritative agent refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify chatgpt_2 inbox
        run: |
          set -euo pipefail
          python3 scripts/inbox_sweep.py --me chatgpt_2 | tee inbox-final.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt2-inbox-final
          path: inbox-final.log
          if-no-files-found: warn
