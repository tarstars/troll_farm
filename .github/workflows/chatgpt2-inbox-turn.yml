name: chatgpt2-inbox-turn

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chatgpt_2
    paths:
      - .github/workflows/chatgpt2-inbox-turn.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all authoritative agent refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Report chatgpt_2 inbox
        run: |
          set +e
          python3 scripts/inbox_sweep.py --me chatgpt_2 | tee inbox-sweep.log
          rc=${PIPESTATUS[0]}
          echo "sweep_exit=$rc"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt2-inbox-sweep
          path: inbox-sweep.log
          if-no-files-found: error
